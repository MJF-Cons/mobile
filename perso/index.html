<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a3d">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="perso.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Perso</title>
<!-- Appli perso de JF (IDEE-014, 2026-11-11) : à faire, agenda, revue de presse, veille achats, programmes TV, météo.
     Page autonome installable sur l'écran d'accueil (Android). Les tâches et les produits surveillés sont gardés sur le
     téléphone ; une fois la base reliée (Réglages), ils sont synchronisés et l'agent IA remplit presse / achats / TV / agenda.
     Base : perso/supabase_perso.sql (fonctions perso_init / perso_sync, protégées par un code). Météo : open-meteo.com. -->
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#0f1e2b;--mut:#5f6f7d;--line:#e1e7ec;--pri:#0f2a3d;--acc:#0e7c86;--accs:#d9f1f2;--red:#c0392b;--amb:#b7791f;--ambs:#fdf3d7;--ok:#1f8a4c}
@media (prefers-color-scheme:dark){:root{--bg:#0b141c;--card:#14212c;--ink:#e8eef3;--mut:#93a3b1;--line:#22323f;--pri:#0b1a26;--acc:#3cc0c9;--accs:#123a40;--red:#ff7b6b;--amb:#f0c060;--ambs:#3a2f12;--ok:#5fd08d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
.top h1{font-size:19px;margin:0;flex:1;font-weight:650}.top small{display:block;font-size:12.5px;font-weight:400;opacity:.75;text-transform:capitalize}
.ib{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:11px;width:42px;height:42px;display:grid;place-items:center;flex:none;position:relative}
.ib svg{width:21px;height:21px}.ib i{position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%;background:#7be0a0}.ib i.w{background:#fbbf24}.ib i.e{background:#f87171}.ib i.n{display:none}
main{padding:12px 12px calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(15,30,43,.08);margin-bottom:12px;overflow:hidden}
.pad{padding:14px 16px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:18px 6px 7px;display:flex;align-items:center;gap:8px}
h2 span{flex:1}h2 button{border:0;background:none;color:var(--acc);font-weight:600;font-size:13px;text-transform:none;letter-spacing:0;padding:4px}
.mut{color:var(--mut);font-size:14px}.sm{font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);position:relative}
.tabs svg{width:23px;height:23px}.tabs .on{color:var(--acc);font-weight:650}
.tabs b{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:10px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.bt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.bt.p{background:var(--acc);border-color:var(--acc);color:#fff}.bt.w{width:100%}.bt.s{min-height:38px;padding:7px 12px;font-size:14px}.bt.d{color:var(--red)}
@media (prefers-color-scheme:dark){.bt.p{color:#062126}}
.f{margin-bottom:11px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.f input,.f select,.f textarea,.add input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);min-height:46px}
.add{display:flex;gap:8px;padding:12px}.add input{flex:1}.add .bt{flex:none;width:48px;padding:0}.add svg{width:22px;height:22px}
.it{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line)}.it:first-child{border-top:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);flex:none;background:none;display:grid;place-items:center;padding:0;margin-top:1px;color:#fff}
.ck svg{width:15px;height:15px;stroke-width:3;opacity:0}.ck.on{background:var(--ok);border-color:var(--ok)}.ck.on svg{opacity:1}
.it .g{flex:1;min-width:0}.it .t{word-break:break-word}.it.done .t{text-decoration:line-through;color:var(--mut)}
.due{font-size:12.5px;color:var(--mut)}.due.l{color:var(--red);font-weight:600}.due.j{color:var(--acc);font-weight:600}
.chip{display:inline-block;font-size:11.5px;font-weight:650;border-radius:20px;padding:2px 9px;background:var(--accs);color:var(--acc);white-space:nowrap}
.chip.a{background:var(--ambs);color:var(--amb)}
.art{display:block;padding:13px 16px;border-top:1px solid var(--line);color:inherit;text-decoration:none}.art:first-child{border-top:0}
.art b{display:block;font-size:15.5px;margin:4px 0 3px;line-height:1.3}.art p{margin:0;font-size:14px;color:var(--mut)}
.art .h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut)}
.px{font-size:19px;font-weight:700}.px.ok{color:var(--ok)}
.wx{display:flex;align-items:center;gap:14px}.wx svg{width:54px;height:54px;color:var(--acc);stroke-width:1.6}.wx .tp{font-size:38px;font-weight:650;line-height:1}
.wd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;text-align:center}.wd div{background:var(--bg);border-radius:12px;padding:8px 2px;font-size:12.5px}
.wd svg{width:26px;height:26px;color:var(--acc);display:block;margin:3px auto;stroke-width:1.7}.wd b{font-size:13.5px}
.empty{padding:26px 18px;text-align:center;color:var(--mut);font-size:14.5px}.empty svg{width:34px;height:34px;display:block;margin:0 auto 8px;opacity:.6;stroke-width:1.6}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,15,22,.55);display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}.rowb{display:flex;gap:8px;margin-top:6px}.rowb .bt{flex:1}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0b1a26;color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.day{font-size:13px;font-weight:700;color:var(--acc);padding:12px 16px 2px;text-transform:capitalize}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const I={home:'<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>',
 todo:'<svg viewBox="0 0 24 24"><path d="m4 6 1.5 1.5L8 5"/><path d="m4 12 1.5 1.5L8 11"/><path d="m4 18 1.5 1.5L8 17"/><path d="M12 6h8M12 12h8M12 18h8"/></svg>',
 news:'<svg viewBox="0 0 24 24"><path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v10a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5M8 17h5"/></svg>',
 shop:'<svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>',
 tv:'<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="m8 2 4 4 4-4"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',check:'<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 part:'<svg viewBox="0 0 24 24"><path d="M12 3v1.5M5.2 6.2l1 1M3 13h1.5M18.8 6.2l-1 1"/><path d="M8.5 12a4 4 0 0 1 7.3-1.5"/><path d="M8 20h9a3.5 3.5 0 0 0 .5-7 5 5 0 0 0-9.6 1.4A3 3 0 0 0 8 20z"/></svg>',
 cloud:'<svg viewBox="0 0 24 24"><path d="M7 19h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.1 12.6 3.5 3.5 0 0 0 7 19z"/></svg>',
 rain:'<svg viewBox="0 0 24 24"><path d="M7 15h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.1 8.6 3.5 3.5 0 0 0 7 15z"/><path d="M8 18.5v2.5M12 18.5v2.5M16 18.5v2.5"/></svg>',
 snow:'<svg viewBox="0 0 24 24"><path d="M7 15h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.1 8.6 3.5 3.5 0 0 0 7 15z"/><path d="M8 19h.01M12 19h.01M16 19h.01M10 21.5h.01M14 21.5h.01"/></svg>',
 storm:'<svg viewBox="0 0 24 24"><path d="M7 15h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.1 8.6 3.5 3.5 0 0 0 7 15z"/><path d="m12.5 15-2.5 4h4l-2.5 4"/></svg>',
 fog:'<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.1 7.6 3.5 3.5 0 0 0 7 14z"/><path d="M5 18h14M7 21.5h10"/></svg>'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
const SS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);};
const frD=(s,o)=>new Date(s+'T12:00:00').toLocaleDateString('fr-FR',o||{weekday:'long',day:'numeric',month:'long'});
const eur=n=>(Math.round(+n*100)/100).toLocaleString('fr-FR',{maximumFractionDigits:2})+' €';
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'#';

/* ---- données : éléments {id,r (rubrique),d (contenu),m (modifié, ms),del,dirty} gardés sur le téléphone ---- */
let S=LS('perso_v1')||{items:{},since:null,cfg:{}},tab='home',sync={k:'n',msg:''},busy=false,syncT=null,wx=LS('perso_wx')||null,showDone=false,toastT=null;
S.items=S.items||{};S.cfg=S.cfg||{};
if(!S.seeded){S.seeded=true;   // produits demandés par JF le 11/11/2026 (modifiables)
  [{nom:'Affleureuse',cible:50,note:'Défonceuse compacte / affleureuse'},{nom:'TV 75 pouces',cible:1000,note:'QLED, Neo QLED ou Mini-LED'}].forEach(d=>{const id=uid();S.items[id]={id,r:'produit',d,m:Date.now(),dirty:true};});}
const save=()=>SS('perso_v1',S);
const all=r=>Object.values(S.items).filter(x=>x.r===r&&!x.del);
function put(r,d,id){id=id||uid();const o=S.items[id]||{id,r};o.d=Object.assign({},o.d,d);o.m=Date.now();o.dirty=true;o.del=false;S.items[id]=o;save();soon();return o;}
function del(id){const o=S.items[id];if(!o)return;o.del=true;o.m=Date.now();o.dirty=true;save();soon();}
function toast(t){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e);}e.textContent=t;e.style.display='';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3000);}

/* ---- synchronisation (si la base est reliée dans Réglages) ---- */
const linked=()=>!!(S.cfg.url&&S.cfg.key&&S.cfg.code);
async function rpc(fn,args){const u=S.cfg.url.replace(/\/+$/,'');const r=await fetch(u+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:S.cfg.key,Authorization:'Bearer '+S.cfg.key,'Content-Type':'application/json'},body:JSON.stringify(args)});
  let d=null;try{d=await r.json();}catch(e){}if(!r.ok)throw new Error((d&&d.message)||('Erreur '+r.status));return d;}
function setSync(k,msg){sync={k,msg:msg||''};const e=$('sdot');if(e)e.className=k;}
function soon(){if(!linked())return;setSync('w');clearTimeout(syncT);syncT=setTimeout(doSync,2000);}
async function doSync(){if(!linked()||busy)return;if(!navigator.onLine){setSync('e','Hors ligne');return;}busy=true;clearTimeout(syncT);
  const out=Object.values(S.items).filter(x=>x.dirty&&['todo','produit','reglage'].includes(x.r)),marks=new Map(out.map(x=>[x.id,x.m]));
  try{const R=await rpc('perso_sync',{code:S.cfg.code,envoi:out.map(x=>({id:x.id,r:x.r,d:x.d,m:x.m,del:!!x.del})),depuis:S.since});
    out.forEach(x=>{if(S.items[x.id]&&S.items[x.id].m===marks.get(x.id))S.items[x.id].dirty=false;});let chg=0;
    (R.items||[]).forEach(y=>{const x=S.items[y.id];if(!x||y.m>x.m||(y.m===x.m&&!x.dirty)){if(!x||JSON.stringify(x.d)!==JSON.stringify(y.d)||!!x.del!==!!y.del)chg++;S.items[y.id]={id:y.id,r:y.r,d:y.d,m:y.m,del:y.del};}});
    Object.values(S.items).forEach(x=>{if(x.del&&!x.dirty)delete S.items[x.id];});   // suppressions connues de la base : oubliées
    S.since=R.now;save();setSync('n');const a=document.activeElement;if(chg&&!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))&&!$('sheet'))render();}
  catch(e){setSync('e',e.message);}finally{busy=false;if(Object.values(S.items).some(x=>x.dirty)&&sync.k!=='e')soon();}}

/* ---- météo (open-meteo.com, sans compte) ---- */
const WMO=c=>c===0?['sun','Ciel dégagé']:c<=2?['part','Éclaircies']:c===3?['cloud','Couvert']:c<=48?['fog','Brouillard']:c<=67?['rain','Pluie']:c<=77?['snow','Neige']:c<=82?['rain','Averses']:c<=86?['snow','Averses de neige']:['storm','Orage'];
async function loadWx(force){const c=S.cfg.ville;if(!c||!c.lat)return;if(!force&&wx&&wx.at&&Date.now()-wx.at<30*60000&&wx.v===c.nom)return;
  try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+c.lat+'&longitude='+c.lon+'&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FParis&forecast_days=5');
    const d=await r.json();if(!d.current)return;wx={at:Date.now(),v:c.nom,cur:d.current,daily:d.daily};SS('perso_wx',wx);if(tab==='home'&&!$('sheet'))render();}catch(e){}}
async function findCity(){const q=$('vq').value.trim(),o=$('vres');if(q.length<2)return;o.innerHTML='<div class="mut">Recherche…</div>';
  try{const d=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=6&language=fr')).json();
    o.innerHTML=(d.results||[]).map(x=>'<button class="bt s w" style="margin-bottom:6px;justify-content:flex-start" onclick="setCity('+x.latitude+','+x.longitude+',\''+esc(x.name).replace(/&#39;/g,'\\&#39;')+'\')">'+esc(x.name)+' <span class="mut sm">'+esc([x.admin2,x.country_code].filter(Boolean).join(', '))+'</span></button>').join('')||'<div class="mut">Aucune commune trouvée.</div>';}
  catch(e){o.innerHTML='<div class="mut">Recherche impossible (pas de réseau ?).</div>';}}
function setCity(lat,lon,nom){S.cfg.ville={lat,lon,nom};save();wx=null;closeSheet();render();loadWx(true);}

/* ---- actions ---- */
function addTodo(){const i=$('nt'),t=i.value.trim();if(!t)return;put('todo',{t,due:$('nd').value||'',done:''});i.value='';$('nd').value='';render();const n=$('nt');n&&n.focus();}
function tog(id){const o=S.items[id];if(!o)return;put('todo',{done:o.d.done?'':iso()},id);render();}
function sheet(html){closeSheet();const s=document.createElement('div');s.className='sheet';s.id='sheet';s.onclick=e=>{if(e.target===s)closeSheet();};s.innerHTML='<div>'+html+'</div>';document.body.appendChild(s);}
function closeSheet(){const s=$('sheet');if(s)s.remove();}
function editTodo(id){const o=S.items[id];if(!o)return;sheet('<h3>Tâche</h3><div class="f"><label>À faire</label><textarea id="et" rows="3">'+esc(o.d.t)+'</textarea></div><div class="f"><label>Échéance (facultative)</label><input type="date" id="ed" value="'+esc(o.d.due||'')+'"></div>'
  +'<div class="rowb"><button class="bt d" onclick="del(\''+id+'\');closeSheet();render()">Supprimer</button><button class="bt p" onclick="put(\'todo\',{t:$(\'et\').value.trim()||\'(sans titre)\',due:$(\'ed\').value},\''+id+'\');closeSheet();render()">Enregistrer</button></div>');}
function editProd(id){const o=id?S.items[id]:null,d=o?o.d:{};sheet('<h3>'+(o?'Produit surveillé':'Nouveau produit à surveiller')+'</h3><div class="f"><label>Produit recherché</label><input id="pn" value="'+esc(d.nom||'')+'" placeholder="ex. Perceuse à colonne"></div>'
  +'<div class="f"><label>Prix maximum (€)</label><input id="pc" type="number" inputmode="decimal" value="'+esc(d.cible||'')+'"></div><div class="f"><label>Précisions (marque, taille, technologie…)</label><textarea id="po" rows="2">'+esc(d.note||'')+'</textarea></div>'
  +'<div class="f"><label>Lien d’un modèle repéré (facultatif)</label><input id="pl" type="url" value="'+esc(d.lien||'')+'" placeholder="https://…"></div>'
  +'<div class="rowb">'+(o?'<button class="bt d" onclick="if(confirm(\'Ne plus surveiller ce produit ?\')){del(\''+id+'\');closeSheet();render()}">Retirer</button>':'<button class="bt" onclick="closeSheet()">Annuler</button>')
  +'<button class="bt p" onclick="saveProd(\''+(id||'')+'\')">Enregistrer</button></div>');}
function saveProd(id){const nom=$('pn').value.trim();if(!nom){toast('Indique le produit recherché');return;}put('produit',{nom,cible:parseFloat($('pc').value)||0,note:$('po').value.trim(),lien:$('pl').value.trim()},id||undefined);closeSheet();render();}
function settings(){const c=S.cfg;sheet('<h3>Réglages</h3><h2 style="margin:0 0 7px"><span>Météo</span></h2><div class="f"><label>Commune'+(c.ville?' — actuelle : '+esc(c.ville.nom):'')+'</label><div style="display:flex;gap:8px"><input id="vq" placeholder="Nom de la commune" onkeydown="if(event.key===\'Enter\')findCity()"><button class="bt" onclick="findCity()">Chercher</button></div></div><div id="vres"></div>'
  +'<h2 style="margin:16px 0 7px"><span>Base de données (synchronisation et veilles)</span></h2><div class="mut sm" style="margin-bottom:9px">'+(linked()?(sync.k==='e'?'Erreur : '+esc(sync.msg):'Base reliée.'+(S.since?' Dernière synchronisation : '+new Date(S.since).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'')):'Non reliée : les tâches et les produits restent sur ce téléphone ; la revue de presse, les bons plans, la TV et l’agenda arriveront une fois la base reliée.')+'</div>'
  +'<div class="f"><label>Adresse du projet</label><input id="cu" value="'+esc(c.url||'')+'" placeholder="https://….supabase.co" autocapitalize="off"></div><div class="f"><label>Clé publique</label><input id="ck" value="'+esc(c.key||'')+'" autocapitalize="off"></div>'
  +'<div class="f"><label>Code d’accès (8 caractères minimum, choisi à la 1re connexion)</label><input id="cc" type="password" value="'+esc(c.code||'')+'"></div><div class="mut sm" id="cmsg"></div>'
  +'<div class="rowb"><button class="bt" onclick="closeSheet()">Fermer</button><button class="bt p" onclick="link()">Relier</button></div>'
  +'<div style="margin-top:12px;text-align:center"><button class="bt s" onclick="exportAll()">Exporter mes données</button></div>');}
async function link(){const u=$('cu').value.trim(),k=$('ck').value.trim(),c=$('cc').value,m=$('cmsg');if(!u&&!k&&!c){S.cfg.url=S.cfg.key=S.cfg.code='';save();closeSheet();render();return;}
  if(!/^https:\/\//.test(u)||!k||c.length<8){m.textContent='Adresse (https://…), clé et code de 8 caractères minimum nécessaires.';return;}m.textContent='Vérification…';const old=Object.assign({},S.cfg);Object.assign(S.cfg,{url:u,key:k,code:c});
  try{const ok=await rpc('perso_init',{code:c});if(!ok)throw new Error('Code incorrect.');S.since=null;Object.values(S.items).forEach(x=>x.dirty=true);save();closeSheet();await doSync();render();toast(sync.k==='e'?'Synchronisation impossible':'Base reliée');}
  catch(e){S.cfg=old;save();m.textContent='Connexion impossible : '+e.message;}}
function exportAll(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({exporte:new Date().toISOString(),items:Object.values(S.items).filter(x=>!x.del)},null,1)],{type:'application/json'}));a.download='perso_'+iso()+'.json';a.click();}
function go(t){tab=t;render();window.scrollTo(0,0);}

/* ---- écrans ---- */
function todoRow(o,T){const d=o.d,l=!d.done&&d.due&&d.due<T,j=!d.done&&d.due===T;
  return '<div class="it'+(d.done?' done':'')+'"><button class="ck'+(d.done?' on':'')+'" onclick="tog(\''+o.id+'\')" aria-label="Fait">'+I.check+'</button><div class="g" onclick="editTodo(\''+o.id+'\')"><div class="t">'+esc(d.t)+'</div>'
    +(d.due&&!d.done?'<div class="due'+(l?' l':j?' j':'')+'">'+(l?'En retard · ':'')+(j?'Aujourd’hui':frD(d.due,{weekday:'short',day:'numeric',month:'short'}))+'</div>':'')+'</div></div>';}
const byDue=(a,b)=>(a.d.due||'9999').localeCompare(b.d.due||'9999')||a.m-b.m;
function offers(pid){return all('offre').filter(x=>!pid||x.d.produit===pid).sort((a,b)=>(b.d.date||'').localeCompare(a.d.date||''));}
function offerRow(o,p){const d=o.d,ok=p&&p.d.cible&&d.prix&&d.prix<=p.d.cible;
  return '<a class="art" href="'+esc(safeUrl(d.url))+'" target="_blank" rel="noopener"><div class="h"><span class="chip'+(d.type==='baisse'||d.type==='bon plan'?' a':'')+'">'+esc(d.type||'offre')+'</span><span>'+esc(d.marchand||'')+'</span><span style="margin-left:auto">'+(d.date?frD(d.date,{day:'numeric',month:'short'}):'')+'</span></div>'
    +'<b>'+esc(d.titre||'')+'</b><div style="display:flex;gap:10px;align-items:baseline"><span class="px'+(ok?' ok':'')+'">'+(d.prix?eur(d.prix):'')+'</span>'+(d.avant?'<span class="mut sm" style="text-decoration:line-through">'+eur(d.avant)+'</span>':'')+(ok?'<span class="chip">sous votre prix</span>':'')+'</div>'+(d.note?'<p>'+esc(d.note)+'</p>':'')+'</a>';}
function artRow(o){const d=o.d;return '<a class="art" href="'+esc(safeUrl(d.url))+'" target="_blank" rel="noopener"><div class="h"><span class="chip">'+esc(d.source||'')+'</span>'+(d.theme?'<span>'+esc(d.theme)+'</span>':'')+'</div><b>'+esc(d.titre||'')+'</b><p>'+esc(d.resume||'')+'</p></a>';}
function tvRow(o){const d=o.d;return '<div class="art"><div class="h"><span class="chip">'+esc(d.chaine||'')+'</span><span>'+esc([d.heure,d.genre].filter(Boolean).join(' · '))+'</span></div><b>'+esc(d.titre||'')+'</b><p>'+esc(d.resume||'')+'</p></div>';}
function groupDays(L,row,desc){const g={};L.forEach(o=>{const k=o.d.date||'';(g[k]=g[k]||[]).push(o);});
  return Object.keys(g).sort((a,b)=>desc?b.localeCompare(a):a.localeCompare(b)).map(k=>'<div class="card">'+(k?'<div class="day">'+frD(k)+'</div>':'')+g[k].map(row).join('')+'</div>').join('');}
const empty=(ic,t)=>'<div class="card"><div class="empty">'+I[ic]+t+'</div></div>';
const WAIT=' sera remplie automatiquement dès que la base sera reliée (Réglages).';
function render(){const T=iso(),todos=all('todo'),open=todos.filter(x=>!x.d.done).sort(byDue),late=open.filter(x=>x.d.due&&x.d.due<=T);let h='';
  if(tab==='home'){const c=S.cfg.ville;
    h+='<div class="card pad">'+(c&&wx&&wx.cur?'<div class="wx">'+I[WMO(wx.cur.weather_code)[0]]+'<div><div class="tp">'+Math.round(wx.cur.temperature_2m)+'°</div><div class="mut">'+WMO(wx.cur.weather_code)[1]+' · vent '+Math.round(wx.cur.wind_speed_10m)+' km/h</div></div><div style="margin-left:auto;text-align:right" class="mut sm" onclick="settings()">'+esc(c.nom)+'</div></div>'
        +'<div class="wd">'+wx.daily.time.slice(1,5).map((d,i)=>'<div>'+frD(d,{weekday:'short'})+I[WMO(wx.daily.weather_code[i+1])[0]]+'<b>'+Math.round(wx.daily.temperature_2m_max[i+1])+'°</b> <span class="mut">'+Math.round(wx.daily.temperature_2m_min[i+1])+'°</span><div class="mut" style="font-size:11.5px">'+(wx.daily.precipitation_probability_max[i+1]||0)+' % pluie</div></div>').join('')+'</div>'
      :'<div class="wx">'+I.part+'<div><b>Météo</b><div class="mut">'+(c?'Chargement…':'Choisissez votre commune.')+'</div></div>'+(c?'':'<button class="bt s" style="margin-left:auto" onclick="settings()">Choisir</button>')+'</div>')+'</div>';
    const dj=open.filter(x=>x.d.due&&x.d.due<=T),rest=open.filter(x=>!x.d.due||x.d.due>T).slice(0,Math.max(0,4-dj.length));
    h+='<h2><span>À faire</span><button onclick="go(\'todo\')">Tout voir ('+open.length+')</button></h2>'+(open.length?'<div class="card">'+dj.concat(rest).map(o=>todoRow(o,T)).join('')+'</div>':empty('todo','Rien à faire pour l’instant.'));
    const ag=all('agenda').filter(x=>x.d.date>=T&&x.d.date<=addDays(T,2)).sort((a,b)=>(a.d.date+(a.d.heure||'')).localeCompare(b.d.date+(b.d.heure||'')));
    h+='<h2><span>Agenda</span></h2>'+(ag.length?'<div class="card">'+ag.map(o=>'<div class="it"><div style="width:74px;flex:none" class="sm"><b>'+(o.d.date===T?'Aujourd’hui':frD(o.d.date,{weekday:'short',day:'numeric'}))+'</b><div class="mut">'+esc(o.d.heure||'journée')+'</div></div><div class="g"><div class="t">'+esc(o.d.titre||'')+'</div>'+(o.d.lieu?'<div class="due">'+esc(o.d.lieu)+'</div>':'')+'</div></div>').join('')+'</div>'
      :'<div class="card pad"><div class="mut" style="margin-bottom:10px">'+(linked()?'Aucun rendez-vous dans les 3 jours.':'La lecture de Google Agenda arrivera avec la base.')+'</div><a class="bt s" href="https://calendar.google.com/calendar/u/0/r" target="_blank" rel="noopener">'+I.cal.replace('<svg','<svg width="18" height="18"')+' Ouvrir Google Agenda</a></div>');
    const of=offers().slice(0,2);if(of.length)h+='<h2><span>Bons plans</span><button onclick="go(\'shop\')">Tout voir</button></h2><div class="card">'+of.map(o=>offerRow(o,S.items[o.d.produit])).join('')+'</div>';
    const pr=all('presse').sort((a,b)=>(b.d.date||'').localeCompare(a.d.date||'')||(a.d.rang||0)-(b.d.rang||0)).slice(0,3);if(pr.length)h+='<h2><span>À la une</span><button onclick="go(\'news\')">Tout voir</button></h2><div class="card">'+pr.map(artRow).join('')+'</div>';}
  if(tab==='todo'){const done=todos.filter(x=>x.d.done).sort((a,b)=>b.m-a.m);
    h+='<div class="card"><div class="add"><input id="nt" placeholder="Nouvelle tâche…" enterkeyhint="done" onkeydown="if(event.key===\'Enter\')addTodo()"><input id="nd" type="date" style="flex:none;width:52px;padding:0 10px" aria-label="Échéance"><button class="bt p" onclick="addTodo()" aria-label="Ajouter">'+I.plus+'</button></div></div>';
    const G=[['En retard',open.filter(x=>x.d.due&&x.d.due<T)],['Aujourd’hui',open.filter(x=>x.d.due===T)],['À venir',open.filter(x=>x.d.due>T)],['Sans date',open.filter(x=>!x.d.due)]];
    h+=G.filter(g=>g[1].length).map(g=>'<h2><span>'+g[0]+'</span></h2><div class="card">'+g[1].map(o=>todoRow(o,T)).join('')+'</div>').join('')||empty('todo','Aucune tâche. Écrivez la première ci-dessus.');
    if(done.length)h+='<h2><span>Faites ('+done.length+')</span><button onclick="showDone=!showDone;render()">'+(showDone?'Masquer':'Afficher')+'</button></h2>'+(showDone?'<div class="card">'+done.slice(0,40).map(o=>todoRow(o,T)).join('')+'</div>':'');}
  if(tab==='news'){const L=all('presse').sort((a,b)=>(a.d.rang||0)-(b.d.rang||0));h+=L.length?groupDays(L,artRow,true):empty('news','La revue de presse du matin'+WAIT+'<div class="sm" style="margin-top:8px">Sources : DNA, Le Figaro, Le Monde, Le Point, Les Échos, Le Moniteur, Paris Match, presse informatique.</div>');}
  if(tab==='shop'){const P=all('produit').sort((a,b)=>a.m-b.m);
    h+=P.map(p=>{const of=offers(p.id);return '<div class="card"><div class="it" onclick="editProd(\''+p.id+'\')"><div class="g"><b style="font-size:16.5px">'+esc(p.d.nom)+'</b><div class="due">'+(p.d.cible?'moins de '+eur(p.d.cible):'sans prix maximum')+(p.d.note?' · '+esc(p.d.note):'')+'</div></div><span class="chip'+(of.length?' a':'')+'">'+(of.length?of.length+' offre'+(of.length>1?'s':''):'en veille')+'</span></div>'+of.slice(0,6).map(o=>offerRow(o,p)).join('')+'</div>';}).join('')
      +'<button class="bt w" onclick="editProd()">'+I.plus.replace('<svg','<svg width="20" height="20"')+' Surveiller un autre produit</button>'
      +(all('offre').length?'':'<div class="mut sm" style="text-align:center;margin-top:12px">Les bons plans, nouveautés et baisses de prix trouvés par l’agent s’afficheront sous chaque produit'+(linked()?'.':' une fois la base reliée.')+'</div>');}
  if(tab==='tv'){const L=all('tv').filter(x=>!x.d.date||x.d.date>=T).sort((a,b)=>(a.d.heure||'').localeCompare(b.d.heure||''));h+=L.length?groupDays(L,tvRow,false):empty('tv','La sélection TV de la semaine'+WAIT+'<div class="sm" style="margin-top:8px">Canal+ et son bouquet (HBO, Apple TV+, OCS…), Netflix, Prime Video.</div>');}
  const nb=late.length,T2={home:['Aujourd’hui',frD(T)],todo:['À faire',open.length+' en cours'],news:['Revue de presse',''],shop:['Veille achats',all('produit').length+' produits surveillés'],tv:['Programmes TV','']}[tab];
  $('app').innerHTML='<div class="top"><h1>'+T2[0]+(T2[1]?'<small>'+T2[1]+'</small>':'')+'</h1><button class="ib" onclick="'+(linked()?'doSync();':'')+'settings()" aria-label="Réglages">'+I.gear+'<i id="sdot" class="'+(linked()?sync.k:'n')+'"></i></button></div><main>'+h+'</main>'
    +'<nav class="tabs">'+[['home','Accueil'],['todo','À faire'],['news','Presse'],['shop','Achats'],['tv','TV']].map(([k,l])=>'<button class="'+(tab===k?'on':'')+'" onclick="go(\''+k+'\')">'+I[k]+l+(k==='todo'&&nb?'<b>'+nb+'</b>':'')+'</button>').join('')+'</nav>';}

window.addEventListener('online',()=>{doSync();loadWx();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){doSync();loadWx();if(!$('sheet'))render();}});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
save();render();loadWx();doSync();
</script>
</body>
</html>
